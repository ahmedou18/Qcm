<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار مبادئ الاقتصاد الكلي - 300 سؤال</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 30px;
        }

        .progress-container {
            width: 100%;
            background: #e0e0e0;
            border-radius: 20px;
            margin-bottom: 20px;
            height: 20px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: #3498db;
            border-radius: 20px;
            transition: width 0.3s ease;
            color: white;
            text-align: center;
            line-height: 20px;
            font-size: 12px;
        }

        .question-card {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            border-right: 5px solid #3498db;
            margin-bottom: 20px;
        }

        .question-number {
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .question-text {
            font-size: 1.2em;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-label {
            display: block;
            padding: 12px 15px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-label:hover {
            background: #eaf2f8;
            border-color: #3498db;
        }

        .option-label.selected {
            background: #d6eaf8;
            border-color: #3498db;
        }

        .option-label input[type="radio"] {
            margin-left: 10px;
            accent-color: #3498db;
        }

        .navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: background 0.2s;
        }

        button:hover {
            background: #2980b9;
        }

        button:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
        }

        .submit-btn {
            background: #27ae60;
        }

        .submit-btn:hover {
            background: #229954;
        }

        .go-to {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .go-to input {
            width: 60px;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 5px;
            text-align: center;
        }

        .result-container {
            display: none;
            text-align: center;
            padding: 30px;
            background: #eaf2f8;
            border-radius: 10px;
            margin-top: 20px;
        }

        .result-container h2 {
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .result-stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .stat-box {
            background: white;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
        }

        .stat-box .label {
            font-size: 0.9em;
            color: #7f8c8d;
        }

        .stat-box .value {
            font-size: 1.8em;
            font-weight: bold;
            color: #2c3e50;
        }

        .grade {
            font-size: 1.2em;
            margin-top: 10px;
            font-weight: bold;
        }

        .review-list {
            text-align: right;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 20px;
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        .review-item {
            padding: 8px;
            border-bottom: 1px solid #eee;
        }

        .review-item.correct {
            color: #27ae60;
        }

        .review-item.wrong {
            color: #e74c3c;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>اختبار مبادئ الاقتصاد الكلي</h1>
        <p class="subtitle">300 سؤال اختيار من متعدد - النتيجة النهائية ستظهر في نهاية الاختبار</p>

        <div id="quiz-area">
            <div class="progress-container">
                <div class="progress-bar" id="progress-bar">0%</div>
            </div>

            <div class="question-card" id="question-card">
                <div class="question-number" id="question-number"></div>
                <div class="question-text" id="question-text"></div>
                <div class="options" id="options-container"></div>
            </div>

            <div class="navigation">
                <div class="nav-buttons">
                    <button id="prev-btn" onclick="changeQuestion(-1)">السابق</button>
                    <button id="next-btn" onclick="changeQuestion(1)">التالي</button>
                </div>
                <div class="go-to">
                    <span>الانتقال إلى سؤال:</span>
                    <input type="number" id="go-to-input" min="1" max="300">
                    <button onclick="goToQuestion()">اذهب</button>
                </div>
                <button class="submit-btn" onclick="submitQuiz()">تسليم الإجابات</button>
            </div>
        </div>

        <div class="result-container" id="result-container">
            <h2>النتيجة النهائية</h2>
            <div class="result-stats">
                <div class="stat-box">
                    <div class="label">الإجابات الصحيحة</div>
                    <div class="value" id="correct-count">0</div>
                </div>
                <div class="stat-box">
                    <div class="label">من أصل</div>
                    <div class="value">300</div>
                </div>
                <div class="stat-box">
                    <div class="label">النسبة المئوية</div>
                    <div class="value" id="percentage">0%</div>
                </div>
            </div>
            <div class="grade" id="grade"></div>
            <button onclick="resetQuiz()">إعادة الاختبار</button>
            <div class="review-list" id="review-list"></div>
        </div>
    </div>

    <script>
        // ========== بيانات الأسئلة (300 سؤال) ==========
        // يتم تحويل الإجابات الصحيحة من الحروف العربية إلى أرقام: أ=0، ب=1، ج=2، د=3
        const questions = [
            {
                q: "ما المقصود بالموارد الاقتصادية؟",
                options: ["الموارد المتوفرة بكثرة في الطبيعة", "الموارد التي تتسم بالندرة والمحدودية", "الموارد التي لا يمكن استخدامها في الإنتاج", "الموارد المتجددة فقط"],
                correct: 1
            },
            {
                q: "الندرة في الاقتصاد تعني:",
                options: ["أن الموارد قليلة بشكل مطلق", "أن الموارد محدودة نسبة إلى الحاجات التي يمكن أن تلبيها", "أن جميع الموارد غير كافية لإشباع حاجة واحدة فقط", "أن الموارد غير موجودة أساساً"],
                correct: 1
            },
            {
                q: "أي من العبارات التالية صحيحة حول قياس الندرة؟",
                options: ["يعتمد على الكمية المتاحة فقط", "يعتمد على الطلب على المورد واستخداماته المختلفة", "يعتمد على سعر المورد فقط", "يعتمد على موقع المورد الجغرافي"],
                correct: 1
            },
            {
                q: "المورد الذي لا يعتبر نادراً في وقت ما قد يصبح نادراً في وقت آخر بسبب:",
                options: ["زيادة كميته", "انخفاض الطلب عليه", "ظهور أهميته في إشباع حاجات معينة", "انخفاض تكلفة إنتاجه"],
                correct: 2
            },
            {
                q: "أي من الأمثلة التالية يمثل مورداً أصبح نادراً نتيجة لتزايد الطلب عليه؟",
                options: ["الهواء", "النفط", "الماء في المناطق المطيرة", "الرمال في الصحراء"],
                correct: 1
            },
            {
                q: "علم الاقتصاد هو علم:",
                options: ["طبيعي", "اجتماعي", "تطبيقي بحت", "فيزيائي"],
                correct: 1
            },
            {
                q: "يركز علم الاقتصاد بشكل أساسي على:",
                options: ["دراسة الظواهر الطبيعية", "الطريقة التي يوظف المجتمع بها موارده الإنتاجية النادرة", "دراسة الكواكب والنجوم", "تحليل النصوص الأدبية"],
                correct: 1
            },
            {
                q: "المشكلة الاقتصادية تتمثل في:",
                options: ["وفرة الموارد في مواجهة الحاجات المحدودة", "محدودية الموارد في مواجهة الحاجات اللامتناهية", "توازن الموارد مع الحاجات", "عدم وجود حاجات إنسانية"],
                correct: 1
            },
            {
                q: "أي من الشروط التالية ليس شرطاً لاعتبار المورد مورداً اقتصادياً؟",
                options: ["أن يكون نادراً", "أن يكون له استخدامات بديلة", "أن يكون متجدداً", "أن يكون مطلوباً لإشباع حاجة"],
                correct: 2
            },
            {
                q: "العلاقة بين علم الاقتصاد وعلم الاجتماع:",
                options: ["علاقة غير مباشرة", "علاقة مباشرة، إذ يجب التعرف على التركيبة السكانية والعادات قبل إعداد السياسات الاقتصادية", "لا توجد علاقة بينهما", "علاقة عكسية"],
                correct: 1
            },
            {
                q: "ما هو الأسلوب الذي يعتمد على استخدام الرموز الرياضية للتعبير عن العلاقات الاقتصادية؟",
                options: ["الأسلوب الوصفي", "الأسلوب الرياضي", "الأسلوب القياسي", "الأسلوب البياني"],
                correct: 1
            },
            {
                q: "التحليل القياسي (Econometric Analysis) يقوم على دمج:",
                options: ["الرياضيات فقط", "الإحصاء فقط", "الرياضيات والإحصاء", "الفلسفة والمنطق"],
                correct: 2
            },
            {
                q: "أي من أساليب التحليل الاقتصادي يوضح العلاقة بين متغيرين فقط في المستوى الدراسي الأولي؟",
                options: ["الأسلوب الرياضي", "الأسلوب القياسي", "التحليل البياني", "الأسلوب الوصفي"],
                correct: 2
            },
            {
                q: "النموذج الاقتصادي هو:",
                options: ["نسخة طبق الأصل من الواقع الاقتصادي", "تجسيد مبسط لبعض الظواهر الاقتصادية لفهم العلاقات بينها", "نظرية فلسفية بحتة", "نظام محاسبي"],
                correct: 1
            },
            {
                q: "يمكن التعبير عن النموذج الاقتصادي في شكل:",
                options: ["معادلات فقط", "رسم بياني فقط", "وصف لفظي فقط", "معادلات، رسم بياني، أو وصف لفظي"],
                correct: 3
            },
            {
                q: "فرضية \"بقاء العوامل الأخرى ثابتة\" تعني باللاتينية:",
                options: ["Ceteris Paribus", "Economic Rationality", "Maximization", "Laissez-Faire"],
                correct: 0
            },
            {
                q: "فرضية الرشد الاقتصادي تعني:",
                options: ["أن الأفراد يتصرفون بعشوائية", "أن الأفراد يهدفون إلى تحقيق أقصى منفعة بأقل تكلفة", "أن الأفراد لا يهتمون بالمكاسب", "أن الأفراد يفضلون الخسارة دائماً"],
                correct: 1
            },
            {
                q: "الفرق بين الرصيد والتدفق هو:",
                options: ["الرصيد يقاس خلال فترة زمنية، والتدفق يقاس في لحظة زمنية", "الرصيد يقاس في لحظة زمنية، والتدفق يقاس خلال فترة زمنية", "لا فرق بينهما", "الرصيد يقاس بالكيلوغرام والتدفق باللتر"],
                correct: 1
            },
            {
                q: "مثال على التدفق:",
                options: ["رصيد الماء في الخزان", "الدخل الشهري", "الثروة", "رأس المال في لحظة معينة"],
                correct: 1
            },
            {
                q: "مثال على الرصيد:",
                options: ["الاستثمار السنوي", "الاستهلاك الشهري", "رصيد رأس المال في نهاية السنة", "الصادرات الشهرية"],
                correct: 2
            },
            {
                q: "العلاقة بين الاستثمار ورصيد رأس المال هي:",
                options: ["الاستثمار هو رصيد، ورأس المال هو تدفق", "الاستثمار هو التغير في رصيد رأس المال", "لا توجد علاقة بينهما", "الاستثمار يساوي رصيد رأس المال دائماً"],
                correct: 1
            },
            {
                q: "الفرق بين الدخل والثروة هو:",
                options: ["الدخل رصيد والثروة تدفق", "الدخل تدفق والثروة رصيد", "الدخل والثروة كلاهما رصيد", "الدخل والثروة كلاهما تدفق"],
                correct: 1
            },
            {
                q: "إذا امتلك شخص منزلاً يدر عليه إيجاراً شهرياً، فإن الإيجار يعتبر:",
                options: ["ثروة", "رصيد", "تدفق نقدي", "استثمار"],
                correct: 2
            },
            {
                q: "قيمة المنزل الذي يملكه الشخص تعتبر:",
                options: ["دخلاً", "تدفقاً", "رصيداً أو ثروة", "استهلاكاً"],
                correct: 2
            },
            {
                q: "أي من المتغيرات التالية يقاس في لحظة زمنية معينة؟",
                options: ["الناتج المحلي السنوي", "الصادرات الشهرية", "عدد السكان في نهاية العام", "الاستثمار الأجنبي المباشر خلال سنة"],
                correct: 2
            },
            {
                q: "أي من المتغيرات التالية يقاس خلال فترة زمنية؟",
                options: ["رصيد البنك في نهاية الشهر", "الثروة العقارية", "الدخل السنوي", "قيمة الأصول الثابتة"],
                correct: 2
            },
            {
                q: "الناتج المحلي الإجمالي هو مقياس:",
                options: ["للرصيد", "للتدفق", "للثروة", "للمخزون"],
                correct: 1
            },
            {
                q: "إهلاك رأس المال يؤدي إلى:",
                options: ["زيادة رصيد رأس المال", "انخفاض رصيد رأس المال", "لا يؤثر على رصيد رأس المال", "زيادة الاستثمار"],
                correct: 1
            },
            {
                q: "إذا زاد تدفق الاستثمار بمعدل يفوق إهلاك رأس المال، فإن رصيد رأس المال:",
                options: ["يزداد", "ينخفض", "يظل ثابتاً", "يتلاشى"],
                correct: 0
            },
            {
                q: "علم الاقتصاد يدرس السلوك كعلاقة بين:",
                options: ["الحاجات المحدودة والموارد الوفيرة", "الحاجات غير المحدودة والموارد النادرة ذات الاستخدامات البديلة", "الحاجات المحدودة والموارد النادرة", "الحاجات غير المحدودة والموارد الوفيرة"],
                correct: 1
            },
            {
                q: "أي من الطرق التالية ليست من طرق حساب الناتج المحلي الإجمالي؟",
                options: ["طريقة المنتجات النهائية", "طريقة القيمة المضافة", "طريقة الدخل", "طريقة التكاليف التاريخية"],
                correct: 3
            },
            {
                q: "طريقة المنتجات النهائية تعتمد على:",
                options: ["جمع قيمة جميع السلع المنتجة بما فيها الوسيطة", "ضرب الكمية المنتجة من كل سلعة في سعرها وجمعها للسلع النهائية فقط", "جمع قيمة السلع الوسيطة فقط", "طرح قيمة السلع الوسيطة من السلع النهائية"],
                correct: 1
            },
            {
                q: "السلعة الوسيطة هي:",
                options: ["سلعة تنتج للاستخدام النهائي", "سلعة تشترى بغرض الاستخدام في عملية إنتاجية أخرى", "سلعة تستورد من الخارج", "سلعة تستهلك مباشرة من قبل الأفراد"],
                correct: 1
            },
            {
                q: "كيف يتم معالجة المخزون في حساب الناتج المحلي بطريقة المنتجات النهائية؟",
                options: ["يضاف مخزون أول السنة ويطرح مخزون آخر السنة", "يضاف مخزون آخر السنة ويطرح مخزون أول السنة", "لا يؤخذ المخزون في الاعتبار", "يضاعف قيمة المخزون"],
                correct: 1
            },
            {
                q: "لماذا تطرح قيمة الواردات من الناتج المحلي؟",

                correct: 1
            },
            {
                q: "طريقة القيمة المضافة تعني:",
                options: ["جمع قيمة المبيعات النهائية فقط", "أخذ الزيادة التي يضيفها كل قطاع في العملية الإنتاجية وجمعها", "حساب قيمة المواد الخام فقط", "طرح قيمة الأجور من قيمة الإنتاج"],
                correct: 1
            },
            {
                q: "طريقة الدخل في حساب الناتج المحلي تعتمد على:",

            },
            {

            },
            {
                q: "أي من العناصر التالية يدخل في حساب الناتج المحلي بطريقة الإنفاق؟",

                correct: 3
            },
            {
                q: "صافي الناتج المحلي يساوي:",

            },
            {
                q: "الدخل المحلي يساوي:",
                options: ["صافي الناتج المحلي - الضرائب غير المباشرة", "صافي الناتج المحلي + الضرائب غير المباشرة", "الناتج المحلي الإجمالي - الضرائب المباشرة", "الناتج المحلي الإجمالي + الضرائب غير المباشرة"],

            },

        // ========== منطق الاختبار ==========
        const totalQuestions = questions.length;
        let currentIndex = 0;
        let userAnswers = new Array(totalQuestions).fill(null);
        let quizSubmitted = false;

        // عناصر DOM
        const questionNumberEl = document.getElementById('question-number');
        const questionTextEl = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const progressBar = document.getElementById('progress-bar');
        const goToInput = document.getElementById('go-to-input');
        const resultContainer = document.getElementById('result-container');
        const quizArea = document.getElementById('quiz-area');

        // عرض السؤال الحالي
        function renderQuestion() {
            const q = questions[currentIndex];
            questionNumberEl.textContent = `سؤال ${currentIndex + 1} من ${totalQuestions}`;
            questionTextEl.textContent = q.q;
            optionsContainer.innerHTML = '';

            q.options.forEach((option, idx) => {
                const label = document.createElement('label');
                label.className = 'option-label';
                if (userAnswers[currentIndex] === idx) {
                    label.classList.add('selected');
                }
                label.innerHTML = `
                    <input type="radio" name="option" value="${idx}" ${userAnswers[currentIndex] === idx ? 'checked' : ''}>
                    ${String.fromCharCode(65 + idx)}) ${option}
                `;
                label.addEventListener('click', () => selectOption(idx));
                optionsContainer.appendChild(label);
            });

            // تحديث أزرار التنقل
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === totalQuestions - 1;

            // تحديث شريط التقدم
            const answeredCount = userAnswers.filter(a => a !== null).length;
            const progressPercent = (answeredCount / totalQuestions) * 100;
            progressBar.style.width = `${progressPercent}%`;
            progressBar.textContent = `${Math.round(progressPercent)}%`;

            // تحديث حقل الانتقال
            goToInput.value = currentIndex + 1;
        }

        // اختيار إجابة
        function selectOption(idx) {
            if (quizSubmitted) return;
            userAnswers[currentIndex] = idx;
            renderQuestion();
        }

        // تغيير السؤال
        function changeQuestion(delta) {
            const newIndex = currentIndex + delta;
            if (newIndex >= 0 && newIndex < totalQuestions) {
                currentIndex = newIndex;
                renderQuestion();
            }
        }

        // الانتقال إلى سؤال محدد
        function goToQuestion() {
            const num = parseInt(goToInput.value);
            if (num >= 1 && num <= totalQuestions) {
                currentIndex = num - 1;
                renderQuestion();
            } else {
                alert(`يرجى إدخال رقم بين 1 و ${totalQuestions}`);
            }
        }

        // تسليم الاختبار
        function submitQuiz() {
            const unanswered = userAnswers.some(a => a === null);
            if (unanswered) {
                const confirmSubmit = confirm("لديك أسئلة غير مجابة. هل تريد التسليم على أي حال؟");
                if (!confirmSubmit) return;
            }

            quizSubmitted = true;
            let correctCount = 0;
            const reviewList = [];

            for (let i = 0; i < totalQuestions; i++) {
                const q = questions[i];
                const userAnswer = userAnswers[i];
                const isCorrect = userAnswer === q.correct;
                if (isCorrect) correctCount++;

                if (userAnswer !== null) {
                    reviewList.push({
                        index: i,
                        userAnswer,
                        correctAnswer: q.correct,
                        isCorrect,
                        questionText: q.q,
                        options: q.options
                    });
                }
            }

            const percentage = (correctCount / totalQuestions) * 100;
            let grade;
            if (percentage >= 90) grade = "ممتاز";
            else if (percentage >= 80) grade = "جيد جداً";
            else if (percentage >= 70) grade = "جيد";
            else if (percentage >= 60) grade = "مقبول";
            else grade = "يحتاج إلى مراجعة";

            // عرض النتيجة
            quizArea.style.display = 'none';
            resultContainer.style.display = 'block';

            document.getElementById('correct-count').textContent = correctCount;
            document.getElementById('percentage').textContent = `${percentage.toFixed(2)}%`;
            document.getElementById('grade').textContent = `التقدير: ${grade}`;

            // قائمة المراجعة
            const reviewContainer = document.getElementById('review-list');
            reviewContainer.innerHTML = '';
            if (reviewList.length === 0) {
                reviewContainer.innerHTML = '<p>لم تتم الإجابة على أي سؤال.</p>';
            } else {
                reviewList.forEach(item => {
                    const div = document.createElement('div');
                    div.className = `review-item ${item.isCorrect ? 'correct' : 'wrong'}`;
                    div.innerHTML = `
                        <strong>سؤال ${item.index + 1}:</strong> ${item.questionText}<br>
                        إجابتك: ${item.userAnswer !== null ? String.fromCharCode(65 + item.userAnswer) : 'لم تجب'} - 
                        الإجابة الصحيحة: ${String.fromCharCode(65 + item.correctAnswer)}
                        ${item.isCorrect ? ' ✔' : ' ✘'}
                    `;
                    reviewContainer.appendChild(div);
                });
            }
        }

        // إعادة الاختبار
        function resetQuiz() {
            userAnswers = new Array(totalQuestions).fill(null);
            quizSubmitted = false;
            currentIndex = 0;
            resultContainer.style.display = 'none';
            quizArea.style.display = 'block';
            renderQuestion();
        }

        renderQuestion();
