<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار المالية العامة والسياسة المالية - 150 سؤال</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 30px;
        }

        .progress-container {
            width: 100%;
            background: #e0e0e0;
            border-radius: 20px;
            margin-bottom: 20px;
            height: 20px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: #3498db;
            border-radius: 20px;
            transition: width 0.3s ease;
            color: white;
            text-align: center;
            line-height: 20px;
            font-size: 12px;
        }

        .question-card {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            border-right: 5px solid #3498db;
            margin-bottom: 20px;
        }

        .question-number {
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .question-text {
            font-size: 1.2em;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-label {
            display: block;
            padding: 12px 15px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-label:hover {
            background: #eaf2f8;
            border-color: #3498db;
        }

        .option-label.selected {
            background: #d6eaf8;
            border-color: #3498db;
        }

        .option-label input[type="radio"] {
            margin-left: 10px;
            accent-color: #3498db;
        }

        .navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: background 0.2s;
        }

        button:hover {
            background: #2980b9;
        }

        button:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
        }

        .submit-btn {
            background: #27ae60;
        }

        .submit-btn:hover {
            background: #229954;
        }

        .go-to {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .go-to input {
            width: 60px;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 5px;
            text-align: center;
        }

        .result-container {
            display: none;
            text-align: center;
            padding: 30px;
            background: #eaf2f8;
            border-radius: 10px;
            margin-top: 20px;
        }

        .result-container h2 {
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .result-stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .stat-box {
            background: white;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
        }

        .stat-box .label {
            font-size: 0.9em;
            color: #7f8c8d;
        }

        .stat-box .value {
            font-size: 1.8em;
            font-weight: bold;
            color: #2c3e50;
        }

        .grade {
            font-size: 1.2em;
            margin-top: 10px;
            font-weight: bold;
        }

        .review-list {
            text-align: right;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 20px;
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        .review-item {
            padding: 8px;
            border-bottom: 1px solid #eee;
        }

        .review-item.correct {
            color: #27ae60;
        }

        .review-item.wrong {
            color: #e74c3c;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>اختبار المالية العامة والسياسة المالية</h1>
        <p class="subtitle">150 سؤال اختيار من متعدد - النتيجة النهائية ستظهر في نهاية الاختبار</p>

        <div id="quiz-area">
            <div class="progress-container">
                <div class="progress-bar" id="progress-bar">0%</div>
            </div>

            <div class="question-card" id="question-card">
                <div class="question-number" id="question-number"></div>
                <div class="question-text" id="question-text"></div>
                <div class="options" id="options-container"></div>
            </div>

            <div class="navigation">
                <div class="nav-buttons">
                    <button id="prev-btn" onclick="changeQuestion(-1)">السابق</button>
                    <button id="next-btn" onclick="changeQuestion(1)">التالي</button>
                </div>
                <div class="go-to">
                    <span>الانتقال إلى سؤال:</span>
                    <input type="number" id="go-to-input" min="1" max="150">
                    <button onclick="goToQuestion()">اذهب</button>
                </div>
                <button class="submit-btn" onclick="submitQuiz()">تسليم الإجابات</button>
            </div>
        </div>

        <div class="result-container" id="result-container">
            <h2>النتيجة النهائية</h2>
            <div class="result-stats">
                <div class="stat-box">
                    <div class="label">الإجابات الصحيحة</div>
                    <div class="value" id="correct-count">0</div>
                </div>
                <div class="stat-box">
                    <div class="label">من أصل</div>
                    <div class="value">150</div>
                </div>
                <div class="stat-box">
                    <div class="label">النسبة المئوية</div>
                    <div class="value" id="percentage">0%</div>
                </div>
            </div>
            <div class="grade" id="grade"></div>
            <button onclick="resetQuiz()">إعادة الاختبار</button>
            <div class="review-list" id="review-list"></div>
        </div>
    </div>

    <script>
        // ========== بيانات الأسئلة (150 سؤالاً) ==========
        // ملاحظة: تم تحويل الإجابات إلى أرقام: أ=0، ب=1، ج=2، د=3
        const questions = [
            {
                q: "المالية العامة تهتم بدراسة النشاط المالي لـ:",
                options: ["الأفراد والشركات الخاصة", "الدولة والهيئات العامة", "البنوك التجارية فقط", "المنظمات غير الحكومية"],
                correct: 1 // ب
            },
            {
                q: "الحاجات العامة غير القابلة للتجزئة هي الحاجات التي:",

                correct: 1 // ب
            },
            {
                q: "أي من التالي يعتبر مثالاً على الحاجات العامة غير القابلة للتجزئة؟",

                correct: 2 // ج
            },
            {
                q: "الحاجات القابلة للتجزئة هي التي:",

                correct: 1 // ب
            },
            {

                options: ["العدالة", "الدفاع عن الوطن", "التعليم", "الأمن الداخلي"],
                correct: 2 // ج
            },
            {
                q: "الفريق الأول من كتاب المالية العامة اعتمد في تحديد الحاجات العامة على:",

                correct: 1 // ب
            },
            {
                q: "الفريق الثاني من كتاب المالية العامة اعتمد في تحديد الحاجات العامة على:",

                correct: 1 // ب
            },
            {
                q: "قانون أقل مجهود في تحديد الحاجات العامة يعني:",

                correct: 1 // ب
            },
            {
                q: "الفريق الرابع في تحديد الحاجات العامة يرى أنها:",
                options: ["كل ما تشبعه الهيئات العامة", "ما تحس به الجماعة", "ما تدخل ضمن مهام الدولة التقليدية (الدفاع، الأمن، العدالة)", "ما يحقق أقل مجهود"],
                correct: 2 // ج
            },
            {
                q: "النقد الموجه للفريق الرابع في تحديد الحاجات العامة هو:",
                options: ["أنه لا ينظر إلى طبيعة الحاجة", "أنه لا يأخذ في الاعتبار الدور الحديث للدولة", "أنه يعتمد على معيار اقتصادي بحت", "أنه يهمل دور الأفراد"],
                correct: 1 // ب
            },
            {
                q: "الدور الحديث للدولة يشمل بالإضافة إلى دورها التقليدي:",

            },
            {
                q: "النقد الموجه لمعيار صفة من يقوم بإشباع الحاجة هو:",

            },
            {

                correct: 1 // ب
            },
            {
                q: "التقليديون أمثال آدم سميث كانوا يعتقدون أن:",

                correct: 1 // ب
            },
            {
                q: "الكساد العالمي الكبير حدث بين:",
                options: ["1914-1918", "1929-1933", "1939-1945", "1973-1975"],
                correct: 1 // ب
            },
            {
                q: "المدرسة الكينزية أكدت على أن:",
                options: ["العرض هو الذي يخلق الطلب", "الطلب هو الذي يخلق العرض", "السوق يصحح نفسه تلقائياً", "لا حاجة لتدخل الدولة"],
                correct: 1 // ب
            },
            {
                q: "وفقاً لكينز، الطلب الفعال يتكون من:",
                options: ["الطلب الخاص فقط", "الطلب الحكومي فقط", "الطلب الخاص + الطلب الحكومي", "الصادرات فقط"],

            },

            },
            {

                correct: 1 // ب
            },
            {
                q: "العلاقة بين المالية العامة والقانون تتمثل في أن:",
                options: ["القانون لا علاقة له بالمالية العامة", "القانون هو الأداة الأساسية لتنظيم المالية العامة", "المالية العامة تتعارض مع القانون", "القانون يهمل الجانب المالي"],

            },

            },

            },

                correct: 1 // ب
            },
            {

            },

        // ========== منطق الاختبار ==========
        const totalQuestions = questions.length; // 150

        let quizSubmitted = false;

        const questionNumberEl = document.getElementById('question-number');
        const questionTextEl = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const progressBar = document.getElementById('progress-bar');
        const goToInput = document.getElementById('go-to-input');
        const resultContainer = document.getElementById('result-container');
        const quizArea = document.getElementById('quiz-area');

        function renderQuestion() {
            const q = questions[currentIndex];
            questionNumberEl.textContent = `سؤال ${currentIndex + 1} من ${totalQuestions}`;
            questionTextEl.textContent = q.q;
            optionsContainer.innerHTML = '';

            q.options.forEach((option, idx) => {
                const label = document.createElement('label');
                label.className = 'option-label';
                if (userAnswers[currentIndex] === idx) {
                    label.classList.add('selected');
                }
                label.innerHTML = `
                    <input type="radio" name="option" value="${idx}" ${userAnswers[currentIndex] === idx ? 'checked' : ''}>
                    ${String.fromCharCode(65 + idx)}) ${option}
                `;
                label.addEventListener('click', () => selectOption(idx));
                optionsContainer.appendChild(label);
            });

            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === totalQuestions - 1;

            const answeredCount = userAnswers.filter(a => a !== null).length;
            const progressPercent = (answeredCount / totalQuestions) * 100;
            progressBar.style.width = `${progressPercent}%`;
            progressBar.textContent = `${Math.round(progressPercent)}%`;

            goToInput.value = currentIndex + 1;
        }

        function selectOption(idx) {
            if (quizSubmitted) return;
            userAnswers[currentIndex] = idx;
            renderQuestion();
        }

        function changeQuestion(delta) {
            const newIndex = currentIndex + delta;
            if (newIndex >= 0 && newIndex < totalQuestions) {
                currentIndex = newIndex;
                renderQuestion();
            }
        }

        function goToQuestion() {
            const num = parseInt(goToInput.value);
            if (num >= 1 && num <= totalQuestions) {
                currentIndex = num - 1;
                renderQuestion();
            } else {
                alert(`يرجى إدخال رقم بين 1 و ${totalQuestions}`);
            }
        }

        function submitQuiz() {
            const unanswered = userAnswers.some(a => a === null);
            if (unanswered) {
                const confirmSubmit = confirm("لديك أسئلة غير مجابة. هل تريد التسليم على أي حال؟");
                if (!confirmSubmit) return;
            }

            quizSubmitted = true;
            let correctCount = 0;
            const reviewList = [];

            for (let i = 0; i < totalQuestions; i++) {
                const q = questions[i];
                const userAnswer = userAnswers[i];
                const isCorrect = userAnswer === q.correct;
                if (isCorrect) correctCount++;

                if (userAnswer !== null) {
                    reviewList.push({
                        index: i,
                        userAnswer,
                        correctAnswer: q.correct,
                        isCorrect,
                        questionText: q.q,
                        options: q.options
                    });
                }
            }

            const percentage = (correctCount / totalQuestions) * 100;
            let grade;
            if (percentage >= 90) grade = "ممتاز";
            else if (percentage >= 80) grade = "جيد جداً";
            else if (percentage >= 70) grade = "جيد";
            else if (percentage >= 60) grade = "مقبول";
            else grade = "يحتاج إلى مراجعة";

            quizArea.style.display = 'none';
            resultContainer.style.display = 'block';

            document.getElementById('correct-count').textContent = correctCount;
            document.getElementById('percentage').textContent = `${percentage.toFixed(2)}%`;
            document.getElementById('grade').textContent = `التقدير: ${grade}`;

            const reviewContainer = document.getElementById('review-list');
            reviewContainer.innerHTML = '';
            if (reviewList.length === 0) {
                reviewContainer.innerHTML = '<p>لم تتم الإجابة على أي سؤال.</p>';
            } else {
                reviewList.forEach(item => {
                    const div = document.createElement('div');
                    div.className = `review-item ${item.isCorrect ? 'correct' : 'wrong'}`;
                    div.innerHTML = `
                        <strong>سؤال ${item.index + 1}:</strong> ${item.questionText}<br>
                        إجابتك: ${item.userAnswer !== null ? String.fromCharCode(65 + item.userAnswer) : 'لم تجب'} - 
                        الإجابة الصحيحة: ${String.fromCharCode(65 + item.correctAnswer)}
                        ${item.isCorrect ? ' ✔' : ' ✘'}
                    `;
                    reviewContainer.appendChild(div);
                });
            }
        }

        function resetQuiz() {
            userAnswers = new Array(totalQuestions).fill(null);
            quizSubmitted = false;
            currentIndex = 0;
            resultContainer.style.display = 'none';
            quizArea.style.display = 'block';
            renderQuestion();
        }
